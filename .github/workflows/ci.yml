on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: &actions-checkout actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: corepack enable
      - uses: &actions-setup-node actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: &setup-node-config
          node-version-file: 'package.json'
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn run lint
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: *actions-checkout
      - run: corepack enable
      - uses: *actions-setup-node
        with: *setup-node-config
      - run: yarn install --immutable
      - run: yarn run typecheck
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: *actions-checkout
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: "ghcr.io/${{ github.repository }}"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
